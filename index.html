<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />

  <!-- custom css -->
  <link rel="stylesheet" href="./assets/CSS/main.css" />

</head>

<body>

  <form class="bookmark-form">
    <div class="form-floating mb-3">
      <input type="text" class="form-control" placeholder="name@example.com">
      <label for="floatingInput">Site Name</label>
    </div>

    <div class="form-floating mb-3">
      <input type="text" class="form-control" placeholder="name@example.com">
      <label for="floatingInput">Site URL</label>
    </div>

    <div class="form-floating mb-3">
      <input type="email" class="form-control" placeholder="name@example.com">
      <label for="floatingInput">User Emial</label>
    </div>

    <div class="form-floating mb-3">
      <input type="password" class="form-control" placeholder="name@example.com">
      <label for="floatingInput">User Password</label>
    </div>


    <div class="form-floating mb-3">
      <button class="btn btn-primary" type="submit">Save</button>
    </div>
  </form>

  <table class="table">
  <thead>
    <tr>
      <th>Site Name</th>
      <th>Site URL</th>
      <th>User Email</th>
      <th>User Password</th>
    </tr>
  </thead>
  <tbody class="sitesData"></tbody>
</table>



  <!-- custome javascript -->
  <script src="./assets/js/main.js"></script>

  <!-- Bootstrap 5.3 -->
  <script src=" https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</body>

</html>
